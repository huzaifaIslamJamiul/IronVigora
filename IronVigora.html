<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IronVigora – Train Hard. Build Strong.</title>
<link rel="icon" id="fv">
<style>
:root{--bg:#f3f6fc;--card:#fff;--tx:#0d1424;--mu:#5b6579;--ac:#2f7bff;--ac2:#00c2ff;--bd:#dfe5f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16;--card:#101831;--tx:#eef2ff;--mu:#97a3c2;--bd:#1f2a4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070b16;--card:#101831;--tx:#eef2ff;--mu:#97a3c2;--bd:#1f2a4a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'Noto Sans Bengali','Hind Siliguri',system-ui,-apple-system,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--bd)}
header img{width:38px;height:38px}.hb{font-weight:800;letter-spacing:3px;line-height:1.1}.hs{font-size:10px;color:var(--mu);letter-spacing:2px}
#th{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer}
main{padding:14px 16px;max-width:640px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:6px 0 10px}h3{font-size:15px;margin:0 0 6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{text-align:center}.st b{display:block;font-size:26px;color:var(--ac)}.st span{font-size:12px;color:var(--mu)}
.b{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.b.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:8px 0;cursor:pointer}nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--ac)}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
label.l{font-size:12px;color:var(--mu);display:block;margin:8px 0 3px}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
.lv{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--bd);color:var(--mu);margin-left:6px;font-weight:400}
.note{font-size:12px;color:var(--mu)}
.hero{text-align:center}.hero img{width:150px;height:150px}.hero p{margin:4px 0;letter-spacing:3px;font-weight:700;color:var(--ac)}
#ses{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.ex input{width:22px;height:22px;margin-top:3px;flex:none}
#tm{font-size:34px;font-weight:800;color:var(--ac);text-align:center}
.t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:30;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<header><img data-logo alt="IronVigora"><div><div class="hb">IRONVIGORA</div><div class="hs">TRAIN HARD. BUILD STRONG.</div></div><button id="th" aria-label="theme">🌓</button></header>
<main>
<section class="v" id="v-home"></section>
<section class="v" id="v-plans" hidden></section>
<section class="v" id="v-lib" hidden></section>
<section class="v" id="v-calc" hidden>
<h2>ক্যালকুলেটর</h2>
<div class="c">
<div class="row"><div><label class="l">লিঙ্গ</label><select id="sx"><option value="m">পুরুষ</option><option value="f">নারী</option></select></div><div><label class="l">বয়স</label><input id="ag" type="number" inputmode="numeric" placeholder="২৫"></div></div>
<div class="row"><div><label class="l">উচ্চতা (সেমি)</label><input id="ht" type="number" inputmode="decimal" placeholder="170"></div><div><label class="l">ওজন (কেজি)</label><input id="wg" type="number" inputmode="decimal" placeholder="70"></div></div>
<label class="l">দৈনিক কার্যকলাপ</label>
<select id="ac"><option value="1.2">প্রায় বসে থাকা</option><option value="1.375">হালকা (সপ্তাহে ১-৩ দিন)</option><option value="1.55" selected>মাঝারি (সপ্তাহে ৩-৫ দিন)</option><option value="1.725">বেশি (সপ্তাহে ৬-৭ দিন)</option></select>
<label class="l">লক্ষ্য</label>
<select id="gl"><option value="-400">ওজন কমানো</option><option value="0" selected>ওজন ধরে রাখা</option><option value="300">মাসল বাড়ানো</option></select>
<p><button class="b" id="cb" style="width:100%">হিসাব করুন</button></p>
<div id="co"></div>
</div>
<p class="note">এই হিসাবগুলো সাধারণ অনুমান, চিকিৎসা রোগ নির্ণয় নয়। স্বাস্থ্যগত সমস্যা থাকলে ডাক্তার বা পুষ্টিবিদের পরামর্শ নিন।</p>
</section>
<section class="v" id="v-track" hidden></section>
</main>
<div id="ses" hidden></div>
<nav>
<button data-t="home" class="on"><b>🏠</b>হোম</button><button data-t="plans"><b>📋</b>প্রোগ্রাম</button><button data-t="lib"><b>💪</b>এক্সারসাইজ</button><button data-t="calc"><b>🧮</b>ক্যালকু</button><button data-t="track"><b>📈</b>প্রগ্রেস</button>
</nav>

['পুষ্টি','ডিম, মাছ, মুরগি, দুধ-দই, ডাল ও সয়া থেকে প্রোটিন নিন। সঙ্গে ভাত, ওটস, আলু, ফল ও সবজি। সুস্থ প্রাপ্তবয়স্কদের পেশি বৃদ্ধিতে দৈনিক প্রায় ১.৪–২.০ গ্রাম প্রোটিন প্রতি কেজি ওজনে একটি প্রচলিত নির্দেশনা।'],
['ঘুম ও রিকভারি','অধিকাংশ প্রাপ্তবয়স্কের জন্য ৭-৯ ঘণ্টা ঘুম ভালো। একই পেশি কঠিনভাবে ট্রেনিংয়ের মাঝে বিশ্রাম দিন। দীর্ঘস্থায়ী ক্লান্তি হলে ট্রেনিং কমান।'],
['ওয়ার্ম-আপ ও কুল-ডাউন','শুরুতে ৫-১০ মিনিট হাঁটা বা সাইক্লিং ও হালকা মোবিলিটি, তারপর হালকা ওজনের প্রস্তুতি সেট। শেষে ৩-৫ মিনিট হাঁটা ও আরামদায়ক স্ট্রেচিং।'],
['সাপ্লিমেন্ট','কোনো সাপ্লিমেন্ট খাবার, ব্যায়াম ও ঘুমের বিকল্প নয়। কিডনির সমস্যা, নিয়মিত ওষুধ বা বিশেষ শারীরিক অবস্থা থাকলে নেওয়ার আগে ডাক্তারের পরামর্শ নিন।'],
['নিরাপত্তা','বুকে ব্যথা, অস্বাভাবিক শ্বাসকষ্ট, মাথা ঘোরা বা তীব্র ব্যথা হলে সঙ্গে সঙ্গে থামুন। এই অ্যাপ সাধারণ ফিটনেস শিক্ষার জন্য, চিকিৎসা পরামর্শ নয়।']
];
function toast(m){const t=document.createElement('div');t.className='t';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function go(t){$$('.v').forEach(e=>e.hidden=e.id!=='v-'+t);$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));scrollTo(0,0);({home:rHome,plans:rPlans,lib:rLib,track:rTrack}[t]||(()=>{}))()}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function streak(){const s=new Set(S.w.map(x=>x.d));let c=0,d=new Date();if(!s.has(iso(d)))d.setDate(d.getDate()-1);while(s.has(iso(d))){c++;d.setDate(d.getDate()-1)}return c}
function rHome(){
const wk=S.w.filter(x=>(Date.now()-new Date(x.d))/864e5<7).length,lw=S.wt.length?S.wt[S.wt.length-1].v+' কেজি':'—';
$('#v-home').innerHTML=`<div class="hero"><img data-logo alt=""><p>TRAIN HARD. BUILD STRONG.</p><span class="note">বিজ্ঞাপনমুক্ত • সম্পূর্ণ ফ্রি</span></div>
<div class="g" style="margin-top:12px"><div class="c st"><b>${S.w.length}</b><span>মোট ওয়ার্কআউট</span></div><div class="c st"><b>${wk}</b><span>গত ৭ দিনে</span></div><div class="c st"><b>${streak()}</b><span>টানা দিন</span></div><div class="c st"><b style="font-size:20px;padding-top:6px">${lw}</b><span>সর্বশেষ ওজন</span></div></div>
<div class="c"><h3>দ্রুত শুরু</h3><p class="note">নতুন হলে বিগিনার ফুল-বডি দিয়ে শুরু করুন।</p><button class="b" id="qs" style="width:100%">বিগিনার Workout A শুরু করুন</button></div>
<h2>গাইড</h2><div class="c">${GUIDE.map(g=>`<details><summary>${g[0]}</summary><p>${g[1]}</p></details>`).join('')}</div>
<div class="c"><button class="b s" id="rs" style="width:100%">সব ডেটা মুছুন</button><p class="note">আপনার ডেটা শুধু এই ডিভাইসের ব্রাউজারে সংরক্ষিত থাকে।</p></div>`;
$$('[data-logo]').forEach(i=>i.src=L);$('#qs').onclick=()=>openSes(0,0);
$('#rs').onclick=()=>{if(confirm('সব ওয়ার্কআউট ও ওজনের ডেটা মুছে যাবে। নিশ্চিত?')){S.w=[];S.wt=[];save();rHome()}}}
function rPlans(){$('#v-plans').innerHTML='<h2>ওয়ার্কআউট প্রোগ্রাম</h2>'+P.map((p,i)=>`<div class="c"><h3>${p.n}</h3><p class="note">${p.s}</p>${p.d.map((d,j)=>`<div class="row" style="align-items:center;margin-top:8px"><span>${d[0]} <span class="note">(${d[1].length}টি)</span></span><button class="b" data-p="${i}" data-d="${j}" style="flex:none">শুরু</button></div>`).join('')}</div>`).join('');
$$('#v-plans [data-p]').forEach(b=>b.onclick=()=>openSes(+b.dataset.p,+b.dataset.d))}
let gf='all';
function rLib(){const v=$('#v-lib');
v.innerHTML=`<h2>এক্সারসাইজ লাইব্রেরি</h2><div class="chips"><button class="chip ${gf==='all'?'on':''}" data-g="all">সব</button>${Object.keys(G).map(k=>`<button class="chip ${gf===k?'on':''}" data-g="${k}">${G[k]}</button>`).join('')}</div><div class="c">${EX.filter(e=>gf==='all'||e.g===gf).map(e=>`<details><summary>${e.n}<span class="lv">${LV[e.l]}</span></summary><p><b>${G[e.g]}</b> • ${e.m}<br>সেট × রেপ: ${e.sr}${e.rs?'<br>বিশ্রাম: '+e.rs+' সেকেন্ড':''}<br>টিপস: ${e.tp}</p></details>`).join('')}</div><p class="note">ব্যথা হলে থামুন। ভারী ওজনের আগে টেকনিক শিখুন।</p>`;
$$('#v-lib .chip').forEach(c=>c.onclick=()=>{gf=c.dataset.g;rLib()})}
let tmr;
function openSes(pi,di){const p=P[pi],d=p.d[di],o=$('#ses');o.hidden=false;document.body.style.overflow='hidden';
o.innerHTML=`<button class="b s" id="cl">← বন্ধ করুন</button><h2>${p.n} – ${d[0]}</h2>`+d[1].map(n=>{const e=X(n);return `<label class="ex"><input type="checkbox"><div><b>${n}</b><br><span class="note">${e?e.sr+(e.rs?' • বিশ্রাম '+e.rs+'সে.':'')+' — '+e.tp:''}</span></div></label>`}).join('')+`<div class="c" style="margin-top:14px"><div id="tm">00:00</div><div class="row"><button class="b s" data-r="60">৬০ সে.</button><button class="b s" data-r="90">৯০ সে.</button><button class="b s" data-r="120">১২০ সে.</button></div></div><button class="b" id="fn" style="width:100%">ওয়ার্কআউট সম্পন্ন</button>`;
const end=()=>{clearInterval(tmr);o.hidden=true;document.body.style.overflow=''};
$('#cl').onclick=end;
$$('#ses [data-r]').forEach(b=>b.onclick=()=>{clearInterval(tmr);let r=+b.dataset.r;const u=()=>{$('#tm').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')};u();tmr=setInterval(()=>{r--;u();if(r<=0){clearInterval(tmr);toast('বিশ্রাম শেষ, পরের সেট শুরু করুন');try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}},1000)});
$('#fn').onclick=()=>{const c=$$('#ses input:checked').length;if(!c){toast('অন্তত একটি এক্সারসাইজ টিক দিন');return}
S.w.push({d:iso(new Date()),n:p.n+' – '+d[0],c:c,t:d[1].length});save();end();toast('ওয়ার্কআউট সেভ হয়েছে 💪');go('track')}}
$('#cb').onclick=()=>{const f=i=>+$('#'+i).value,m=$('#sx').value==='m',a=f('ag'),h=f('ht'),w=f('wg'),o=$('#co');
if(!(a>0&&h>0&&w>0)){o.textContent='সব ঘর পূরণ করুন।';return}
const bmi=w/((h/100)**2),cat=bmi<18.5?'কম ওজন':bmi<25?'স্বাভাবিক পরিসর':bmi<30?'অতিরিক্ত ওজন':'স্থূলতার পরিসর',bmr=10*w+6.25*h-5*a+(m?5:-161),td=bmr*f('ac'),bf=Math.max(2,1.2*bmi+0.23*a-10.8*(m?1:0)-5.4),tg=td+f('gl');
o.innerHTML=`<div class="g"><div class="c st"><b>${bmi.toFixed(1)}</b><span>BMI (${cat})</span></div><div class="c st"><b>${Math.round(bmr)}</b><span>BMR (কিলোক্যালরি)</span></div><div class="c st"><b>${Math.round(td)}</b><span>TDEE (কিলোক্যালরি)</span></div><div class="c st"><b>${Math.round(tg)}</b><span>লক্ষ্য ক্যালরি/দিন</span></div></div><p>প্রোটিন: প্রায় <b>${Math.round(w*1.4)}–${Math.round(w*2)} গ্রাম</b> প্রতিদিন<br>বডি-ফ্যাট (মোটামুটি অনুমান): <b>~${bf.toFixed(0)}%</b></p><p class="note">ওজন কমানোর সময় ক্যালরি অতিরিক্ত কমাবেন না, ধীরে ও স্থিরভাবে এগোন।</p>`};
function rTrack(){const wt=S.wt.slice(-20);let svg='';
if(wt.length>1){const vs=wt.map(x=>x.v),mn=Math.min(...vs)-1,mx=Math.max(...vs)+1,pt=wt.map((x,i)=>(10+i*(280/(wt.length-1)))+','+(110-(x.v-mn)/(mx-mn)*100));svg=`<svg viewBox="0 0 300 120" style="width:100%"><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pt.join(' ')}"/>${pt.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.5" fill="var(--ac2)"/>`).join('')}</svg>`}
$('#v-track').innerHTML=`<h2>প্রগ্রেস</h2><div class="c"><h3>ওজন (কেজি)</h3>${svg||'<p class="note">চার্ট দেখতে কমপক্ষে ২টি এন্ট্রি দিন।</p>'}<div class="row"><input id="wi" type="number" inputmode="decimal" placeholder="আজকের ওজন"><button class="b" id="wa" style="flex:none">যোগ করুন</button></div></div><div class="c"><h3>ওয়ার্কআউট ইতিহাস</h3>${S.w.length?S.w.slice(-12).reverse().map(x=>`<div class="ex"><div><b>${x.n}</b><br><span class="note">${x.d} • ${x.c}/${x.t} এক্সারসাইজ</span></div></div>`).join(''):'<p class="note">এখনো কোনো ওয়ার্কআউট নেই। প্রোগ্রাম থেকে শুরু করুন।</p>'}</div>`;
$('#wa').onclick=()=>{const v=+$('#wi').value;if(!(v>20&&v<400)){toast('সঠিক ওজন লিখুন');return}const d=iso(new Date()),i=S.wt.findIndex(x=>x.d===d);i>=0?S.wt[i].v=v:S.wt.push({d:d,v:v});save();rTrack()}}
function theme(t){S.th=t;document.documentElement.dataset.theme=t;save()}
$('#th').onclick=()=>theme(S.th==='dark'?'light':'dark');
theme(S.th);rHome();
</script>
</body>
</html>
